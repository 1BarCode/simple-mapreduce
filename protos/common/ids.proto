syntax = "proto3";

package mr;

message JobId {
    int64 epoch = 1;
    int32 seq = 2;
}

message TaskId {
    JobId job_id = 1;
    bool is_map = 2;
    int32 task_number = 3;
}

message TaskAttemptId {
    TaskId task_id = 1;
    int32 attempt_number = 2;
}

message WorkerId {
    string value = 1;
}
